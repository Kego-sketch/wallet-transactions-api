name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Re-run tests before release
        run: npm test && npm run test:integration

      - name: Build versioned artefact
        run: npm run build

      - name: Zip artefact
        run: |
          cd dist
          zip -r ../wallet-transactions-${{ github.ref_name }}.zip .

      - name: Create GitHub Release with notes & artefact
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: wallet-transactions-${{ github.ref_name }}.zip
